name: Android APK

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  # Android 16
  ANDROID_API: "36"
  BUILD_TOOLS: "36.0.0"
  NDK_VERSION: "27.2.12479018"

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3
        with:
          # The default also asks for the removed "tools" package, which fails
          packages: platform-tools

      - name: Install SDK platform, build tools and NDK
        run: sdkmanager "platforms;android-${ANDROID_API}" "build-tools;${BUILD_TOOLS}" "ndk;${NDK_VERSION}"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: Install trunk and tauri-cli
        run: cargo install trunk tauri-cli --locked

      - name: Generate Android project
        working-directory: app
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}
        run: |
          cargo tauri android init
          # Compile and target the latest Android API level
          sed -i -E "s/compileSdk = [0-9]+/compileSdk = ${ANDROID_API}/; s/targetSdk = [0-9]+/targetSdk = ${ANDROID_API}/" src-tauri/gen/android/app/build.gradle.kts
          grep -E "compileSdk|targetSdk|minSdk" src-tauri/gen/android/app/build.gradle.kts

      - name: Build APK
        working-directory: app
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/${{ env.NDK_VERSION }}
        run: cargo tauri android build --apk

      - name: Sign APK
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          tools="$ANDROID_HOME/build-tools/$BUILD_TOOLS"
          unsigned=$(find app/src-tauri/gen/android/app/build/outputs/apk -name '*-release-unsigned.apk' | head -1)
          name="ornithoquizz-${GITHUB_REF_NAME}.apk"
          echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.p12"
          "$tools/zipalign" -p -f 4 "$unsigned" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" sign --ks "$RUNNER_TEMP/release.p12" --ks-type PKCS12 \
            --ks-pass env:KEYSTORE_PASSWORD --out "$name" "$RUNNER_TEMP/aligned.apk"
          "$tools/apksigner" verify --print-certs "$name"
          rm "$RUNNER_TEMP/release.p12"
          echo "APK=$name" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ornithoquizz-apk
          path: ${{ env.APK }}

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.APK }}
          generate_release_notes: true
