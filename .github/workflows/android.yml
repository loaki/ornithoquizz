name: Android APK

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install NDK
        run: sdkmanager "ndk;27.2.12479018"

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown,aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android,i686-linux-android

      - uses: Swatinem/rust-cache@v2

      - name: Install trunk and tauri-cli
        run: cargo install trunk tauri-cli --locked

      - name: Build APK
        working-directory: app
        env:
          NDK_HOME: ${{ env.ANDROID_HOME }}/ndk/27.2.12479018
        run: |
          cargo tauri android init
          cargo tauri android build --apk

      - uses: actions/upload-artifact@v4
        with:
          name: ornithoquizz-apk
          path: app/src-tauri/gen/android/app/build/outputs/apk/**/*.apk
