[package]
name = "pipeline"
version = "0.1.0"
edition.workspace = true

[dependencies]
model = { path = "../crates/model" }
serde.workspace = true
serde_json = "1"
anyhow = "1"
clap = { version = "4", features = ["derive"] }
reqwest = { version = "0.12", default-features = false, features = ["blocking", "json", "rustls-tls"] }
sha2 = "0.10"
regex = "1"
